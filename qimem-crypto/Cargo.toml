[package]
name = "qimem-crypto"
version = "0.1.0"
edition = "2021"

[features]
default = ["std"]
std = ["dep:rand_core", "ed25519-dalek/rand_core", "x25519-dalek/static_secrets"]

[dependencies]
aes-gcm = { version = "0.10", default-features = false, features = ["aes"] }
sha2 = { version = "0.10", default-features = false }
hkdf = { version = "0.12", default-features = false }
subtle = { version = "2.6", default-features = false }
zeroize = { version = "1.8", features = ["zeroize_derive"] }
rand_core = { version = "0.6", optional = true, features = ["getrandom"] }
ed25519-dalek = { version = "2.1", default-features = false, features = ["zeroize"] }
x25519-dalek = { version = "2.0", default-features = false }
pqcrypto-kyber = { version = "0.7" }
pqcrypto-traits = "0.3"
thiserror = "1.0"
getrandom = { version = "0.2", default-features = false, features = ["js"] }
