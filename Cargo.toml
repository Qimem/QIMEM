[package]
name = "qimem"
version = "0.1.0"
edition = "2021"

[lib]
name = "qimem"
crate-type = ["rlib"]

[[bin]]
name = "qimem"
path = "src/main.rs"

[dependencies]
# Keep PyO3 for the library part (if you need Python extension)
pyo3 = { version = "0.22.6", features = ["abi3-py38"] }
# Keep all your existing dependencies
argon2 = "0.5"
rand = "0.8"
rand_core = { version = "0.6", features = ["std"] }
sha2 = "0.10"
thiserror = "1.0"
ed25519-dalek = { version = "2.1", features = ["std", "rand_core"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
totp-rs = "5.7"
regex = "1.10"
bincode = "1.3"
chacha20poly1305 = "0.10"
axum = "0.7"
tokio = { version = "1.39", features = ["macros", "rt-multi-thread"] }
tower = "0.5"
tower-http = { version = "0.5", features = ["cors", "trace"] }
tower_governor = "0.4"
jsonwebtoken = "9.3"
pqcrypto-kyber = "0.7"
pqcrypto-traits = "0.3"
hkdf = "0.12"
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
zeroize = "1.8"
chrono = { version = "0.4", features = ["serde"] }
sqlx = { version = "0.7", features = ["runtime-tokio", "postgres", "macros", "migrate", "uuid", "chrono", "json", "tls-rustls"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
subtle = "2.6"
dotenvy = "0.15"
log = "0.4"
env_logger = "0.11"
config = "0.14"

[dev-dependencies]
sqlx = { version = "0.7", features = ["runtime-tokio", "postgres", "macros", "migrate", "tls-rustls"] }
testcontainers = "0.23"
testcontainers-modules = { version = "0.11", features = ["postgres"] }

[build-dependencies]
pyo3-build-config = "0.22"
