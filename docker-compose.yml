services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: qimem
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

 qimem-api:
  image: ://mcr.microsoft.com
  tty: true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      QIMEM_MODE: stateful
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/qimem
      QIMEM_BIND: 0.0.0.0:8080
      RUST_LOG: info
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 10
