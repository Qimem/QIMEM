name: rust-ci

on:
  push:
  pull_request:

jobs:
  rust-check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: qimem
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d qimem"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/qimem?sslmode=disable
      RUST_LOG: info

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Copy env template
        run: cp .env.example .env

      - name: Format check
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test --all-targets

      - name: Start docker compose dependencies
        run: docker compose up -d postgres

      - name: API smoke test
        run: |
          cargo run --bin qimem-api &
          API_PID=$!
          for i in {1..20}; do
            if curl -sf http://localhost:8080/health; then
              break
            fi
            sleep 2
          done
          curl -sf http://localhost:8080/health | grep '"status":"ok"'
          kill "$API_PID"
